name: Add Arrow D-pad PathFinder option

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-pathfinder-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Arrow D-pad option
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/ui/panel.js")
          text = path.read_text(encoding="utf-8")
          old = '<select id="minibia-bot-cave-pathfinder-mode"><option value="game">Game</option><option value="direct">Direct</option></select>'
          new = '<select id="minibia-bot-cave-pathfinder-mode"><option value="game">Game</option><option value="direct">Direct</option><option value="smartA">Smart A</option><option value="smartAField">Smart A + Field Crossing</option><option value="arrow">Arrow / D-pad</option></select>'
          if old not in text:
              raise SystemExit("Expected PathFinder Mode select was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/add-arrow-dpad-option.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/panel.js .github/workflows/add-arrow-dpad-option.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Arrow D-pad PathFinder Mode option"
          git push origin HEAD:main
