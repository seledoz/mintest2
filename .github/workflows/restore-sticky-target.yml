name: Restore sticky target
on:
  push:
    branches: ["fix/restore-sticky-target-2026-09-16"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sticky target logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/modules/auto-attack-priority.js")
          s = p.read_text()
          old = '''    const currentTarget = getCurrentTarget();\n    const currentTargetAlive = currentTarget && !currentTarget.isDead && currentTarget.dead !== true;\n    const entries = getTargetEntries();'''
          new = '''    const currentTarget = getCurrentTarget();\n    const currentTargetAlive = currentTarget && !currentTarget.isDead && currentTarget.dead !== true;\n    const targetingOverrideActive = (!!config.enabled && config.creatureNames.length > 0) || !!config.highestHpEnabled;\n    if (!targetingOverrideActive && currentTargetAlive) return currentTarget;\n\n    const entries = getTargetEntries();'''
          if old not in s:
              raise SystemExit("preferred-target anchor not found")
          s = s.replace(old, new, 1)
          old = '''        if (!config.highestHpEnabled && currentTargetAlive && topPriorityEntries.some((entry) => Number(entry.monster?.id) === Number(currentTarget.id))) return currentTarget;\n        return topPriorityEntries.sort(config.highestHpEnabled ? sortHighestHp : sortNearest)[0]?.monster || null;'''
          new = '''        if (currentTargetAlive) {\n          const currentEntry = topPriorityEntries.find((entry) => Number(entry.monster?.id) === Number(currentTarget.id));\n          if (currentEntry) return currentTarget;\n        }\n        return topPriorityEntries.sort(config.highestHpEnabled ? sortHighestHp : sortNearest)[0]?.monster || null;'''
          if old not in s:
              raise SystemExit("priority sticky anchor not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/auto-attack-priority.js
          git rm .github/workflows/restore-sticky-target.yml
          git commit -m "Restore Auto Attack 2.0 sticky target"
          git push