name: Fix Pathfinder Mode duplicate options
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch pz-bot.js and remove workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'pz-bot.js';
            const fileResponse = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const file = Array.isArray(fileResponse.data) ? fileResponse.data[0] : fileResponse.data;
            let text = Buffer.from(file.content, 'base64').toString('utf8');
            if (!text.includes('function normalizePathfinderModeControls()')) {
              const marker = '  async function loadSourceFile(path){';
              const fn = `  function normalizePathfinderModeControls() {
    const canonical = [["game","Game"],["direct","Direct"],["smartA","Smart A"],["smartAField","Smart A + Field Crossing"],["arrow","Arrow / D-pad"]];
    const selects = Array.from(document.querySelectorAll("select")).filter((select) => {
      if (select.id === "minibia-bot-cave-pathfinder-mode") return true;
      const labels = Array.from(select.options).map((option) => String(option.textContent || "").trim());
      return labels.includes("Smart A") && labels.includes("Smart A + Field Crossing");
    });
    selects.forEach((select) => {
      const currentValue = String(select.value || "game");
      const validValue = canonical.some(([value]) => value === currentValue) ? currentValue : "game";
      select.replaceChildren(...canonical.map(([value, label]) => { const option = document.createElement("option"); option.value = value; option.textContent = label; return option; }));
      select.value = validValue;
    });
  }
`;
              if (!text.includes(marker)) throw new Error('loadSourceFile marker not found');
              text = text.replace(marker, fn + marker);
            }
            const old = 'keepPanelTitleBlank();console.log(`[minibia-bot] Loaded source files from ${repository}@${ref}`);';
            const replacement = 'keepPanelTitleBlank();normalizePathfinderModeControls();let pathfinderNormalizeAttempts=0;const pathfinderNormalizeTimerId=window.setInterval(()=>{normalizePathfinderModeControls();pathfinderNormalizeAttempts+=1;if(pathfinderNormalizeAttempts>=20)window.clearInterval(pathfinderNormalizeTimerId);},250);console.log(`[minibia-bot] Loaded source files from ${repository}@${ref}`);';
            if (!text.includes(replacement)) {
              if (!text.includes(old)) throw new Error('load completion marker not found');
              text = text.replace(old, replacement);
            }
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: 'Fix Pathfinder Mode duplicate options', content: Buffer.from(text, 'utf8').toString('base64'), sha: file.sha, branch: 'main' });
            const workflowPath = '.github/workflows/fix-pathfinder-dropdown.yml';
            const wf = await github.rest.repos.getContent({ owner, repo, path: workflowPath, ref: 'main' });
            const wfFile = Array.isArray(wf.data) ? wf.data[0] : wf.data;
            await github.rest.repos.deleteFile({ owner, repo, path: workflowPath, message: 'Remove temporary Pathfinder dropdown workflow', sha: wfFile.sha, branch: 'main' });
